name: Build Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run build.ps1
      shell: pwsh
      run: |
        $env:CI = "true"
        ./build.ps1

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: ${{ env.USERPROFILE }}\Downloads\InstantTanukiMaker-win-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install zstd
      run: sudo apt-get update && sudo apt-get install -y zstd

    - name: Run build.sh
      run: |
        chmod +x ./build.sh
        ./build.sh

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        # 直接用绝对路径，防止变量解析抽风
        path: /home/runner/Downloads/InstantTanukiMaker-linux-x64.tar.zst

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/*.zip
          artifacts/*.tar.zst
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
