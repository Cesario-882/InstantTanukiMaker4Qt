name: Build with PyInstaller

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 解析 platform_tag ----------
      - name: Resolve platform tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            . /etc/os-release
            echo "tag=linux-ubuntu${VERSION_ID}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "tag=win-x64" >> "$GITHUB_OUTPUT"
          else
            echo "tag=unknown" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      # ---------- 从 Test-1.9 Release 拉 Material ----------
      - name: Download Material
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download Test-1.9 \
            --repo Cesario-882/InstantTanukiMaker4Qt \
            --pattern "Material.tar.zst" \
            --clobber
          zstd -d Material.tar.zst -o Material.tar
          tar -xf Material.tar
          rm Material.tar Material.tar.zst
          echo "--- Material 顶层结构 ---"
          ls Material/ | head -10

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-freeze.txt
          pip install pyinstaller

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zstd \
            libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0

      - name: Verify dirs
        shell: bash
        run: |
          test -f main.spec || (echo "缺少 main.spec" && exit 1)
          test -d Data     || (echo "缺少 ./Data"     && exit 1)
          test -d Material || (echo "缺少 ./Material" && exit 1)
          test -d 添加     || (echo "缺少 ./添加"     && exit 1)
          test -d locale   || (echo "缺少 ./locale"   && exit 1)

      # ---------- PyInstaller 打包 ----------
      - name: Build
        run: pyinstaller --noconfirm main.spec

      # ---------- 拷外置目录到产物旁 ----------
      - name: Stage external dirs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist\InstantTanukiMaker"
          Copy-Item -Recurse -Force Material "$out\Material"
          Copy-Item -Recurse -Force 添加     "$out\添加"
          Copy-Item -Recurse -Force locale   "$out\locale"

      - name: Stage external dirs (Linux)
        if: runner.os == 'Linux'
        run: |
          out=dist/InstantTanukiMaker
          cp -r Material "$out/Material"
          cp -r 添加     "$out/添加"
          cp -r locale   "$out/locale"

      # ---------- 完整包 ----------
      - name: Package full (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/InstantTanukiMaker/* `
            -DestinationPath "InstantTanukiMaker.${{ steps.tag.outputs.tag }}.zip" -Force

      - name: Package full (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -C dist/InstantTanukiMaker -cf - . | \
            zstd -19 -T0 -o "InstantTanukiMaker.${{ steps.tag.outputs.tag }}.tar.zst"

      # ---------- 替换包（只 exe + ELF_requirements/） ----------
      - name: Package replace (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = "package_replace"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item -Force "dist\InstantTanukiMaker\InstantTanukiMaker.exe" "$tmp\InstantTanukiMaker.exe"
          Copy-Item -Recurse -Force "dist\InstantTanukiMaker\ELF_requirements" "$tmp\ELF_requirements"
          Compress-Archive -Path "$tmp\*" `
            -DestinationPath "InstantTanukiMaker.${{ steps.tag.outputs.tag }}.replace.zip" -Force

      - name: Package replace (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package_replace
          cp dist/InstantTanukiMaker/InstantTanukiMaker package_replace/
          cp -r dist/InstantTanukiMaker/ELF_requirements package_replace/
          tar -C package_replace -cf - . | \
            zstd -19 -T0 -o "InstantTanukiMaker.${{ steps.tag.outputs.tag }}.replace.tar.zst"

      # ---------- Artifacts ----------
      - name: Upload full (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-full
          path: InstantTanukiMaker.${{ steps.tag.outputs.tag }}.zip

      - name: Upload replace (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-replace
          path: InstantTanukiMaker.${{ steps.tag.outputs.tag }}.replace.zip

      - name: Upload full (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-full
          path: InstantTanukiMaker.${{ steps.tag.outputs.tag }}.tar.zst

      - name: Upload replace (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-replace
          path: InstantTanukiMaker.${{ steps.tag.outputs.tag }}.replace.tar.zst

      # ---------- Release ----------
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            InstantTanukiMaker.*.zip
            InstantTanukiMaker.*.tar.zst
          fail_on_unmatched_files: false
